name: Build Jikan for Roothide

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Jikan
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main
          remotelog: true
          remotelog-src: waruhachi/RemoteLog
          remotelog-branch: main
          libgcuniversal: true
          libgcuniversal-src: waruhachi/LibGcUniversal
          libgcuniversal-branch: main
          altlist: true
          altlist-src: opa334/AltList
          altlist-branch: main
          comet: true
          comet-src: waruhachi/Comet
          comet-branch: main
          orion: true
          orion-src: theos/orion
          orion-branch: master

      - name: Build Jikan
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Jikan-Roothide-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
